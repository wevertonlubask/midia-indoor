# ─────────────────────────────────────────────────────────────────────────────
# SignFlow — Stack completa para Docker Desktop (local)
#   docker compose -f docker-compose.local.yml --env-file .env.docker up -d --build
#   Acesse: http://localhost  (admin@signflow.com / admin123)
# ─────────────────────────────────────────────────────────────────────────────
name: signflow-local

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: signflow-backend:local
  env_file: .env.docker
  volumes:
    - uploads_data:/app/uploads

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio saiu do Docker Hub; a imagem Bitnami usa as mesmas MINIO_ROOT_*
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Migrações + seed (executa uma vez e encerra)
  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    # Arquivos do agente do Raspberry Pi servidos em /api/v1/agent/
    volumes:
      - uploads_data:/app/uploads
      - ./raspi-agent:/raspi-agent:ro
    environment:
      AGENT_DIST_DIR: /raspi-agent
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    <<: *backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default,video_transcode --concurrency=2
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_beat:
    <<: *backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    volumes: []
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    image: signflow-frontend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/waiting.html:/usr/share/nginx/html/waiting.html:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
